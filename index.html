<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Smika — انتقلنا إلى عنوان جديد</title>

    <!--
      صفحة إعادة التوجيه للجذر القديم portfoliohubs.github.io
      - تعمل بدون جافاسكريبت (وصف التحويل) ومعها (استبدال بلا أثر في التاريخ).
      - لا تضع CNAME ولا تغيّر أي مستودع آخر: صفحات الأطباء المنشورة في مستودعاتها
        تُقدَّم من تلك المستودعات ولا تمرّ بهذا الملف إطلاقًا.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://smika.app/" />
    <meta http-equiv="refresh" content="0; url=https://smika.app/" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#011017" />
    <meta property="og:title" content="Smika — موقع الطبيب المهني" />
    <meta property="og:url" content="https://smika.app/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #011017;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #0ab4fc; font-weight: 700; }
      p { line-height: 1.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>Smika انتقلت إلى عنوانها الجديد</h1>
      <p>
        يتم تحويلك الآن تلقائيًا. إن لم يحدث ذلك، اضغط على الرابط:
        <a href="https://smika.app/">smika.app</a>
      </p>
      <p dir="ltr">Smika has moved. <a href="https://smika.app/">Tap here if you are not redirected.</a></p>
    </main>
    <script>
      // استبدال لا يضيف صفحة جديدة في سجل التاريخ، فيعود الزائر للخلف إلى صفحته الطبيعية.
      try {
        window.location.replace('https://smika.app/' + window.location.hash);
      } catch (e) {
        window.location.href = 'https://smika.app/';
      }
    </script>
  </body>
</html>
