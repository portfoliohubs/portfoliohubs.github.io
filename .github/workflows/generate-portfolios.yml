name: Generate Static Doctor Portfolios (SEO Engine)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason or doctor username'
        required: false
        default: 'Manual test execution'
  repository_dispatch:
    types: [admin_approved, generate_pages, new_doctor_published]
  schedule:
    # Auto-run every 6 hours as a fail-safe to ensure all newly approved doctors are published
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'static-pages-and-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy-static-portfolios:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Run Static Portfolio Generator Engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          BASE_URL: 'https://portfoliohubs.github.io'
        run: node scripts/generate-static-pages.mjs

      - name: 🔍 Check for New Static HTML & Image Assets
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain public/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit & Push Generated Pages to Repository
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'portfoliohubs-bot[bot]'
          git config --global user.email 'portfoliohubs-bot@users.noreply.github.com'
          git add public/
          git commit -m "chore(portfolios): auto-publish static doctor pages, sitemap & WebP assets [skip ci]"
          git push origin HEAD

      - name: 🏗️ Build Web Application & Static Assets (Vite)
        run: npm run build

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
