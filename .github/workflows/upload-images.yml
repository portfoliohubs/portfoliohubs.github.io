name: Upload Images
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder path (e.g. ads or empty for doctor slug)'
        required: false
        type: string
        default: ''
      slug:
        description: 'Doctor slug directory'
        required: false
        type: string
        default: ''
      images_base64:
        description: 'Base64 encoded WebP image'
        required: true
        type: string
      filename:
        description: 'Target filename (without extension)'
        required: false
        type: string
        default: 'image'
      repo_target:
        description: 'Target repository for images'
        required: true
        type: string
        default: 'dental-images-1'
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo_target }}
          token: ${{ secrets.PAT_GITHUB }}
      - name: Save and Commit Image
        run: |
          TARGET_DIR="."
          if [ -n "${{ inputs.folder }}" ] && [ -n "${{ inputs.slug }}" ]; then
            TARGET_DIR="${{ inputs.folder }}/${{ inputs.slug }}"
          elif [ -n "${{ inputs.folder }}" ]; then
            TARGET_DIR="${{ inputs.folder }}"
          elif [ -n "${{ inputs.slug }}" ]; then
            TARGET_DIR="${{ inputs.slug }}"
          fi
          mkdir -p "$TARGET_DIR"
          echo "${{ inputs.images_base64 }}" | base64 -d > "$TARGET_DIR/${{ inputs.filename }}.webp"
          git config user.name "PortfolioHubs Bot"
          git config user.email "bot@portfoliohubs.com"
          git add .
          git commit -m "Add image ${{ inputs.filename }} in $TARGET_DIR [skip ci]" || echo "No changes to commit"
          git push
